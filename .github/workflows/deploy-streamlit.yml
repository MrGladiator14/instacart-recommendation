name: Deploy Streamlit App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install streamlit
        
    - name: Verify model exists
      run: |
        if [ ! -f "production_models/lgbm_reorder_model.pkl" ]; then
          echo "Error: Model file not found"
          echo "Available files in production_models/:"
          ls -la production_models/ || echo "production_models directory not found"
          exit 1
        fi
        
    - name: Start API server
      env:
        GPU_AVAILABLE: false
      run: |
        python api_server.py > server.log 2>&1 &
        echo "Server started, waiting for initialization..."
        sleep 20
        echo "Checking if server is responding..."
        curl -f http://localhost:8000/health || (echo "Server failed to start:" && cat server.log && exit 1)
        
    - name: Test API connection
      run: |
        curl -f http://localhost:8000/health || exit 1
        
    - name: Deploy to Streamlit Community Cloud
      uses: streamlit/streamlit-app-action@v0.0.3
      with:
        app-file: streamlit_app.py
        python-version: '3.12'
        dependencies-file: requirements.txt
